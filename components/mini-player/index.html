<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="player.css"><title>Zvuk mini player</title></head><body><main><header><span class="brand">Zvuk</span><button id="close" aria-label="Закрыть">×</button></header><section class="cover"><img id="cover" alt="Обложка"><span id="placeholder">♪</span></section><section class="metadata"><strong id="title">Нет трека</strong><span id="artist">Пожалуйста, войдите в zvuk.com</span></section><p id="notice" role="status">Откройте zvuk.com в главном окне</p><section class="progress"><input id="seek" type="range" min="0" max="100" value="0"><div><time id="current">0:00</time><time id="duration">0:00</time></div></section><section class="transport"><button id="prev" title="Предыдущий">◀◀</button><button id="play" class="primary" title="Play/Pause">▶</button><button id="next" title="Следующий">▶▶</button></section><section class="options"><button id="shuffle" title="Перемешать">⤨</button><button id="repeat" title="Повтор">↻<small id="repeat-mode"></small></button><button class="hifi" type="button" tabindex="-1">HiFi</button><label title="Громкость"><button id="mute">🔊</button><input id="volume" type="range" min="0" max="100" value="70"></label></section><button id="retry" hidden>Повторить</button></main><script src="player.js"></script></body></html>
