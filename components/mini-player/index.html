<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src https: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="stylesheet" href="player.css" />
    <title>Zvuk mini player</title>
  </head>
  <body>
    <main>
      <header><span class="brand">Zvuk</span><button id="close" aria-label="Закрыть">×</button></header>
      <section class="cover"><img id="cover" alt="Обложка" /><span id="placeholder">♪</span></section>
      <section class="metadata">
        <strong id="title">Нет трека</strong><span id="artist">Пожалуйста, войдите в zvuk.com</span>
      </section>
      <p id="notice" role="status">Откройте zvuk.com в главном окне</p>
      <section class="progress">
        <input id="seek" type="range" min="0" max="100" value="0" />
        <div><time id="current">0:00</time><time id="duration">0:00</time></div>
      </section>
      <section class="transport">
        <button id="prev" title="Предыдущий">◀◀</button
        ><button id="play" class="primary" title="Play/Pause">
          <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path id="play-icon" d="M8 5v14l11-7z" fill="currentColor"/>
            <path id="pause-icon" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor" style="display: none"/>
          </svg></button
        ><button id="next" title="Следующий">▶▶</button>
      </section>
      <section class="options">
        <button id="shuffle" title="Перемешать">⤨</button
        ><button id="repeat" title="Повтор">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17 2L21 6L17 10M3 11V9C3 7.89543 3.89543 7 5 7H21M7 22L3 18L7 14M21 13V15C21 16.1046 20.1046 17 19 17H3"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <text id="repeat-one-badge" x="12" y="15" text-anchor="middle" fill="currentColor" font-size="10" font-weight="bold" style="display: none">1</text>
          </svg></button
        ><button class="hifi" type="button" tabindex="-1">HiFi</button
        ><label title="Громкость"
          ><button id="mute">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path id="volume-icon" d="M11 5L6 9H2V15H6L11 19V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="volume-waves" d="M15.54 8.46C16.4774 9.39764 17.0039 10.6692 17.0039 11.995C17.0039 13.3208 16.4774 14.5924 15.54 15.53M19.07 4.93C20.9447 6.80528 21.9979 9.34836 21.9979 12C21.9979 14.6516 20.9447 17.1947 19.07 19.07" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path id="volume-mute-x" d="M15.5 8.5L19.5 12.5M19.5 8.5L15.5 12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display: none"/>
            </svg></button><input id="volume" type="range" min="0" max="100" value="70"
        /></label>
      </section>
      <button id="retry" hidden>Повторить</button>
    </main>
    <script src="player.js"></script>
  </body>
</html>
